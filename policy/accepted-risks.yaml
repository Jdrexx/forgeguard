# ForgeGuard — Accepted Risks (Expiring Suppressions)
#
# Findings listed here are suppressed from the policy gate up to the
# expiry date. After the expiry date, the suppression is ignored and
# the finding counts toward the severity budget.
#
# This file is consumed by the ForgeGuard policy engine. Each entry
# must have at minimum a rule_id or file pattern. The `expires` field
# uses ISO 8601 format (YYYY-MM-DD).
#
# Past-date entries (expired) are included here to demonstrate that
# the policy engine correctly ignores them.
#
# NOTE ON THE SELF-SCAN: this repository is the ForgeGuard product and
# its pipeline scans its OWN image and source. Three classes of findings
# are therefore suppressed with a documented reason — teaching fixtures,
# remediated mirror pairs, and upstream CVEs with no fix available:
#   1. app/vulnerable/* — deliberately-vulnerable DEMO_MODE-only fixtures
#      (never shipped; DEMO_MODE defaults to 0).
#   2. app/fixed/* residual scanner flags — the remediated mirror pair is
#      safe by construction (real containment checks, JSON not pickle);
#      CodeQL does not model is_relative_to() containment as a sanitizer.
#   3. grype OS-layer CVEs with no fix in any current upstream image
#      (python 3.14.7, busybox 1.37) — re-review on expiry; the image is
#      pinned to digest and apk-upgraded at build time.

