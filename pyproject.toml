[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Show 2 slowest tests, print summary
addopts = [
    "-v",
    "--tb=short",
    "--durations=2",
    "--strict-markers",
]

markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "container: tests that require Docker daemon",
]
