# ForgeGuard — Release Pipeline
#
# Signed image + SBOM publish with provenance attestation.
# Triggered on tags or manual workflow dispatch.
name: ForgeGuard Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., v1.2.3)"
        required: true

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build → Sign → Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349  # v3.7.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567  # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804  # v5.7.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        id: build
        uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355  # v6.10.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true           # generate SBOM during build
          provenance: true     # attest build provenance

      - name: Generate SPDX SBOM via Syft
        uses: anchore/sbom-action@f5a39a8fb9fb24e5c0e4ff0c5d3853e4b21ee162  # v0.17.9
        with:
          image: ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}
          format: spdx-json
          output-file: sbom-spdx.json

      - name: Generate CycloneDX SBOM via Syft
        uses: anchore/sbom-action@f5a39a8fb9fb24e5c0e4ff0c5d3853e4b21ee162
        with:
          image: ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}
          format: cyclonedx-json
          output-file: sbom-cyclonedx.json

      - name: Install cosign
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da  # v3.7.1

      - name: Sign container image (keyless)
        run: |
          cosign sign --yes \
            --annotation "version=${{ steps.meta.outputs.version }}" \
            --annotation "ref=${{ github.ref }}" \
            --annotation "commit=${{ github.sha }}" \
            ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}

      - name: Attach SBOM as attestation
        run: |
          cosign attest --yes \
            --predicate sbom-spdx.json --type spdx \
            ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}

      - name: Attach CycloneDX SBOM as attestation
        run: |
          cosign attest --yes \
            --predicate sbom-cyclonedx.json --type cyclonedx \
            ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}

      - name: Generate provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Verify attestation
        run: |
          cosign verify-attestation --type spdx \
            ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1  # v4.6.1
        with:
          name: release-artifacts
          path: |
            sbom-spdx.json
            sbom-cyclonedx.json
          retention-days: 90
