# ForgeGuard — Release Pipeline
#
# Signed image + SBOM publish with provenance attestation.
# Triggered on tags or manual workflow dispatch.
name: ForgeGuard Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., v1.2.3)"
        required: true

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build → Sign → Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        id: build
        uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355 # v6.10.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true # generate SBOM during build
          provenance: true # attest build provenance

      - name: Generate SPDX SBOM via Syft
        uses: anchore/sbom-action@df80a981bc6edbc4e220a492d3cbe9f5547a6e75 # v0.17.9
        with:
          image: ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}
          format: spdx-json
          output-file: sbom-spdx.json

      - name: Generate CycloneDX SBOM via Syft
        uses: anchore/sbom-action@df80a981bc6edbc4e220a492d3cbe9f5547a6e75
        with:
          image: ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}
          format: cyclonedx-json
          output-file: sbom-cyclonedx.json

      - name: Install cosign
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.1

      - name: Resolve lowercase image reference
        id: img
        run: |
          echo "ref=ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]' >> "$GITHUB_OUTPUT"

      - name: Sign container image (keyless)
        # Context values (${{ github.* }}, ${{ steps.* }}) are passed through
        # env vars, never spliced into the script — a branch/tag name crafted
        # by an attacker must not be able to inject shell commands (run+
        # shell-injection). "${VAR}" expansion is data, not code.
        env:
          ANNOTATION_VERSION: ${{ steps.meta.outputs.version }}
          ANNOTATION_REF: ${{ github.ref }}
          ANNOTATION_COMMIT: ${{ github.sha }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_REF: ${{ steps.img.outputs.ref }}
        run: |
          cosign sign --yes \
            --annotation "version=${ANNOTATION_VERSION}" \
            --annotation "ref=${ANNOTATION_REF}" \
            --annotation "commit=${ANNOTATION_COMMIT}" \
            "${IMAGE_REF}@${IMAGE_DIGEST}"

      - name: Attach SBOM as attestation
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_REF: ${{ steps.img.outputs.ref }}
        run: |
          cosign attest --yes \
            --predicate sbom-spdx.json --type spdx \
            "${IMAGE_REF}@${IMAGE_DIGEST}"

      - name: Attach CycloneDX SBOM as attestation
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_REF: ${{ steps.img.outputs.ref }}
        run: |
          cosign attest --yes \
            --predicate sbom-cyclonedx.json --type cyclonedx \
            "${IMAGE_REF}@${IMAGE_DIGEST}"

      - name: Generate provenance attestation
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ steps.img.outputs.ref }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Verify attestation
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_REF: ${{ steps.img.outputs.ref }}
        run: |
          cosign verify-attestation --type spdx \
            "${IMAGE_REF}@${IMAGE_DIGEST}"

      - name: Upload release artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: release-artifacts
          path: |
            sbom-spdx.json
            sbom-cyclonedx.json
          retention-days: 90