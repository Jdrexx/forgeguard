# ForgeGuard — Security Gate Pipeline
#
# The pipeline IS the product. This workflow runs SAST, dependency scanning,
# container build + vulnerability scan, SBOM generation, and a DAST scan
# against an ephemeral deployment.
#
# ── Workflow Jobs ───────────────────────────────────────────────────────
# 1. sast            — CodeQL analysis (JavaScript, Python)
# 2. deps-and-lint   — pip-audit + Bandit (Python deps & SAST)
# 3. build-scan-sbom — Docker buildx, Grype scan, Syft SBOM, cosign attest
# 4. dast            — ZAP baseline scan against ephemeral deployment
# 5. policy-gate     — ForgeGuard policy evaluation (blocks on budget breach)
#
name: ForgeGuard Security Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# ── Least-privilege permissions ────────────────────────────────────────
# Read-only by default; write only where explicitly needed.
permissions:
  contents: read
  security-events: write # needed for SARIF upload
  id-token: write # needed for cosign identity token
  packages: read # read ghcr.io packages

jobs:
  # ── 1. SAST — CodeQL ─────────────────────────────────────────────────
  sast:
    name: SAST — CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [python]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b56ba49b26e50535fa1e7f7db0f4f7b4bf65d80d # v3.28.10
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@b56ba49b26e50535fa1e7f7db0f4f7b4bf65d80d

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b56ba49b26e50535fa1e7f7db0f4f7b4bf65d80d
        with:
          output: sarif-results
          category: "${{ matrix.language }}"

      - name: Upload CodeQL SARIF
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: sarif-results/
          retention-days: 7

  # ── 2. Dependencies & Linting ────────────────────────────────────────
  deps-and-lint:
    name: Deps & Lint — pip-audit + Bandit
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: Run Bandit SAST
        run: |
          bandit -r security/ app/ -f json -o bandit-output.json || true
        continue-on-error: true

      - name: Run pip-audit
        run: |
          pip-audit --format json -o pip-audit-output.json || true
        continue-on-error: true

      - name: Run Gitleaks secret scan
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/latest/download/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar xz gitleaks
          ./gitleaks detect --source . --report-path gitleaks-output.json --report-format json --no-banner || true
        continue-on-error: true

      - name: Upload scanner results
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: scanner-results
          path: |
            bandit-output.json
            pip-audit-output.json
            gitleaks-output.json
          retention-days: 7

  # ── 3. Build, Scan, SBOM ─────────────────────────────────────────────
  build-scan-sbom:
    name: Build → Scan → SBOM → Attest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push image to ghcr.io
      id-token: write # cosign keyless signing

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Build and push (multi-stage, --load)
        id: build
        uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355 # v6.10.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Scan image with Grype
        uses: anchore/scan-action@1638637db639e0ade3258b51db49a9a137574c3e # v6
        id: grype-scan
        with:
          # Scan the image the build actually produced. The build tags it via
          # docker/metadata-action (ghcr.io/<repo>:main) and --loads it locally;
          # the :<sha> tag is never pushed, so grype would pull a phantom image.
          image: ${{ steps.meta.outputs.tags }}
          severity-cutoff: high
          output-format: json
          fail-build: false # policy gate handles the decision

      - name: Upload Grype results
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: grype-results
          path: ${{ steps.grype-scan.outputs.json }}
          retention-days: 7

      - name: Generate SBOM (SPDX + CycloneDX)
        uses: anchore/sbom-action@df80a981bc6edbc4e220a492d3cbe9f5547a6e75 # v0.17.9
        with:
          image: ${{ steps.meta.outputs.tags }}
          format: spdx-json
          output-file: sbom-spdx.json

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@df80a981bc6edbc4e220a492d3cbe9f5547a6e75
        with:
          image: ${{ steps.meta.outputs.tags }}
          format: cyclonedx-json
          output-file: sbom-cyclonedx.json

      - name: Install cosign
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.1

      - name: Resolve lowercase image reference
        id: img
        run: |
          # ghcr references must be all-lowercase. GitHub context values keep
          # the repo's original casing (Jdrexx/forgeguard), which cosign's
          # reference parser rejects - docker normalized the pushed image to
          # ghcr.io/jdrexx/forgeguard, so force-lowercase here.
          echo "ref=ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]' >> "$GITHUB_OUTPUT"

      - name: Sign container image (keyless)
        run: |
          cosign sign --yes ${{ steps.img.outputs.ref }}@${{ steps.build.outputs.digest }}

      - name: Attach SBOM as attestation
        run: |
          cosign attest --yes --predicate sbom-spdx.json --type spdx \
            ${{ steps.img.outputs.ref }}@${{ steps.build.outputs.digest }}

      - name: Upload SBOMs
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: sboms
          path: |
            sbom-spdx.json
            sbom-cyclonedx.json
          retention-days: 30

  # ── 4. DAST — ZAP Baseline Scan ──────────────────────────────────────
  dast:
    name: DAST — OWASP ZAP
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # ZAP action files an issue when the scan fails thresholds

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Start ephemeral deployment
        run: |
          # The app image is not loaded in this job (build-scan-sbom is a
          # separate runner), so build it locally before composing up.
          docker compose -f docker-compose.yml build app
          docker compose -f docker-compose.yml up -d redis app
          # Wait for the app to be ready
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8000/livez && break
            sleep 2
          done

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@7c4deb10e6261301961c86d65d54a516394f9aed # v0.14.0
        with:
          target: http://localhost:8000
          rules_file_name: .zap/rules.tsv
          cmd_options: "-a -j"
          issue_title: "ZAP Baseline Scan"

      - name: Upload ZAP report
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: zap-report
          path: zap-report.json
          retention-days: 7

      - name: Tear down ephemeral deployment
        if: always()
        run: docker compose -f docker-compose.yml down

  # ── 5. Policy Gate — the differentiator ──────────────────────────────
  policy-gate:
    name: Policy Gate — ForgeGuard
    runs-on: ubuntu-latest
    needs: [sast, deps-and-lint, build-scan-sbom, dast]
    if: always()
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: "3.12"

      - name: Install ForgeGuard
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download all scanner results
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          pattern: "*-results"
          merge-multiple: true
          path: scan-results/

      - name: Download SBOMs for enrichment
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806
        with:
          name: sboms
          path: scan-results/sboms/

      # The grype adapter (fail-closed) expects grype.json / grype-output.json /
      # vuln-scan.json at the top of scan-results/. The build job uploads the
      # scan-action output as artifact grype-results with its own filename -
      # download and stage it under a name the adapter recognizes.
      - name: Download Grype results
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806
        with:
          name: grype-results
          path: grype-artifacts/

      - name: Stage Grype results for policy gate
        run: |
          mkdir -p scan-results
          # scan-action v6 writes its results to a file literally named
          # 'output' (no extension) - stage it as grype.json for the adapter.
          find grype-artifacts -type f -name output -exec cp {} scan-results/grype.json \; || true
          if [ ! -f scan-results/grype.json ]; then
            find grype-artifacts -name '*.json' -exec cp {} scan-results/grype.json \;
          fi

      # The zap adapter expects zap-report.json in scan-results/. The ZAP
      # baseline action uploads its report as artifact zap_scan - download and
      # stage it under the adapter's expected name.
      - name: Download ZAP report
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806
        with:
          name: zap_scan
          path: zap-artifacts/

      - name: Stage ZAP results for policy gate
        run: |
          mkdir -p scan-results
          find zap-artifacts -name '*.json' -exec cp {} scan-results/zap-report.json \;

      # The CodeQL adapter (fail-closed) expects codeql-results.sarif at the
      # top of scan-results/. The CodeQL job uploads its SARIF as artifact
      # codeql-sarif-<lang> (never matched by *-results above) - download it
      # and stage it under the name the adapter looks for.
      - name: Download CodeQL SARIF
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806
        with:
          pattern: codeql-sarif-*
          path: codeql-artifacts/
          merge-multiple: true

      - name: Stage CodeQL results for policy gate
        run: |
          mkdir -p scan-results
          cp codeql-artifacts/*.sarif scan-results/codeql-results.sarif

      - name: Run ForgeGuard policy gate
        id: policy
        run: |
          python -m security.policy scan-results/ \
            --policy policy/security-policy.yaml \
            --allowlist policy/accepted-risks.yaml \
            --sarif-output policy-results.sarif
        continue-on-error: true

      - name: Upload policy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@b56ba49b26e50535fa1e7f7db0f4f7b4bf65d80d
        with:
          sarif_file: policy-results.sarif
          category: forgeguard-policy

      - name: Fail pipeline if policy gate rejected
        if: steps.policy.outcome == 'failure'
        run: |
          echo "::error::ForgeGuard policy gate REJECTED — severity budget breached."
          exit 1