# ForgeGuard — Local Demo Environment
#
# Spins up the app, a ZAP container for DAST, and Redis for session storage.
# Usage:
#   docker compose up -d
#   docker compose exec app python -c "import app.main; print('ok')"
#
version: "3.9"

services:
  # ── Application ──────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DEMO_MODE=${DEMO_MODE:-0}
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=info
    depends_on:
      redis:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/livez')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - forgeguard-net

  # ── Redis ────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data
    networks:
      - forgeguard-net

  # ── OWASP ZAP (DAST) ────────────────────────────────────────────────
  zap:
    image: ghcr.io/zaproxy/zaproxy:stable@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef
    command: >
      zap.sh -daemon -port 8080 -host 0.0.0.0
      -config api.disablekey=true
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
    ports:
      - "8080:8080"
    networks:
      - forgeguard-net

volumes:
  redis-data:

networks:
  forgeguard-net:
    driver: bridge